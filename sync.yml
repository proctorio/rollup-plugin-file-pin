trigger:
  branches:
    include:
    - main

resources:
  repositories:
    - repository: templates
      type: git
      name: Plumbing/core-templates
    - repository: rollup-plugin-file-pin
      type: git
      name: Open/rollup-plugin-file-pin

stages:
- template: stages/sync/sync.yml@templates  # Template reference
  parameters:
    checkout: rollup-plugin-file-pin
    # GitHub-side merges auto-publish (Mike-approved 2026-09-13); the
    # refs/mirror/main echo marker prevents ping-pong.
    skip_ci: false

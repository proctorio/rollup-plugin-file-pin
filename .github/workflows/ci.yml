name: ci

# Canonical source of this workflow is the internal Open repo; the sync
# mirrors it here. Validates community pull requests with the same install,
# test, and build gates the internal pipeline runs, so a merge that cannot
# build or install never reaches the release flow. Runs read-only on fork
# PRs, and main is force-push-mirrored from the internal repo, so this is
# informational for maintainers rather than a branch protection gate.

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run build
